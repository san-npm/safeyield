name: Collect APY History

on:
  # Run every hour at minute 0
  schedule:
    - cron: '0 * * * *'

  # Allow manual trigger
  workflow_dispatch:

# Allow workflow to push commits
permissions:
  contents: write

# Prevent concurrent runs from conflicting
concurrency:
  group: collect-apy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: collector/package-lock.json

      - name: Install collector dependencies
        working-directory: collector
        run: npm ci

      - name: Get current index hash
        id: get-hash
        run: |
          # Read the current index hash. Only forward it to GITHUB_OUTPUT if it
          # matches a strict format (64 hex chars = Aleph SHA-256 item_hash).
          # This blocks GitHub Actions output injection if the file is ever
          # tampered with, and silently drops "local-..." pseudo-hashes that
          # the legacy SDK left behind so we don't feed them back in.
          CURRENT_HASH=$(cat public/apy-history-hash.txt 2>/dev/null || true)
          if [[ "$CURRENT_HASH" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Current hash: $CURRENT_HASH"
            echo "hash=$CURRENT_HASH" >> "$GITHUB_OUTPUT"
          else
            echo "No valid current hash (got: '$CURRENT_HASH')"
            echo "hash=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run APY collector
        working-directory: collector
        env:
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
          HISTORY_INDEX_HASH: ${{ steps.get-hash.outputs.hash }}
        run: npm run collect

      - name: Update index hash in repo
        run: |
          # Read the new hash and require strict 64-hex-char format
          # (Aleph SHA-256 item_hash). This rejects "local-..." pseudo-hashes
          # left over from SDK-init failures (the frontend can't resolve them
          # on IPFS so committing them silently breaks APY history) and also
          # any malformed value that could enable workflow injection.
          NEW_HASH=$(cat collector/data/index-hash.txt)
          if [[ ! "$NEW_HASH" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid index hash, refusing to commit: $NEW_HASH"
            echo "::error::Aleph upload did not produce a real CID (ALEPH_PRIVATE_KEY missing or invalid?)"
            exit 1
          fi
          echo "New index hash: $NEW_HASH"

          # Update the hash file
          printf '%s\n' "$NEW_HASH" > public/apy-history-hash.txt

          # Also update .env.production for static builds
          printf 'NEXT_PUBLIC_HISTORY_INDEX_HASH=%s\n' "$NEW_HASH" > .env.production

      - name: Commit and push new hash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage the files first (handles both new and modified files)
          git add public/apy-history-hash.txt .env.production

          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: Update APY history index hash [skip ci]"

          # Pull latest changes and rebase our commit on top, then push
          # This handles the case where another commit was pushed while we were running
          git pull --rebase origin main
          git push
